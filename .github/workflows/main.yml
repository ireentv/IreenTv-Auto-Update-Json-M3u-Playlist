name: Automated Willow JSON Updater

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Sync and Update Log
        run: |
          export TZ="Asia/Kolkata"
          git pull origin main --rebase

          # ১. JSON ফাইল ডাউনলোড
          curl -sS -o willow.json "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json"

          # ২. M3U ফাইলটি অস্থায়ী (temp) ফাইলে ডাউনলোড
          curl -sS -L -o temp_willow.m3u "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u"

          # ৩. মোট চ্যানেল সংখ্যা ও সময় বের করা
          TOTAL_CHANNELS=$(grep -c "^#EXTINF" temp_willow.m3u || echo "0")
          LAST_UPDATE=$(date +'%d-%m-%Y %I:%M %p')

          # ৪. পুরনো ফাইলের ডুপ্লিকেট #EXTM3U বাদ দেওয়া
          sed -i '/^#EXTM3U/d' temp_willow.m3u

          # ৫. কাস্টম হেডার সহ willow.m3u তৈরি
          {
            echo "#EXTM3U"
            echo "# Playlist Name: Willow Sports Live"
            echo "# Owner: MD ANAMUL HOQUE"
            echo "# Telegram: https://t.me/ireentv"
            echo "# Website: https://anamul.pages.dev"
            echo "# Developer: IreenTechnology"
            echo "# Version: 1.0"
            echo "# Channels Amount: $TOTAL_CHANNELS"
            echo "# Last Update: $LAST_UPDATE"
            echo ""
            cat temp_willow.m3u
          } > willow.m3u

          # ৬. অস্থায়ী ফাইল মুছে ফেলা
          rm -f temp_willow.m3u

          # ৭. লগ ফাইলে রেকর্ড যোগ করা
          echo "🚀 Willow Synced | IST: $(date +'%Y-%m-%d %H:%M:%S') | ID: $RANDOM" >> willow.txt

      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add willow.json willow.m3u willow.txt
          if ! git diff --cached --quiet; then
            git commit -m "Willow Database Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi
